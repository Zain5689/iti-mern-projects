<div class="container mx-auto max-w-7xl px-4 py-16">
  <div class="mb-12 border-l-4 border-blue-500 pl-6">
    <h1 class="text-4xl font-black text-white tracking-tighter uppercase">Trending Now</h1>
    <p class="text-slate-400 mt-2 font-medium">Discover the most watched movies this week.</p>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-8">
    @for (movie of MOVIES_DATA; track movie.id) {
      <div
        class="group relative bg-slate-900/50 rounded-2xl overflow-hidden border border-slate-800 hover:border-blue-500/50 transition-all duration-500 shadow-2xl hover:-translate-y-2"
      >
        <div class="relative aspect-2/3 overflow-hidden">
          <img
            [src]="imgPrefix + movie.poster_path"
            [alt]="movie.title"
            class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700 ease-in-out"
          />

          <div
            class="absolute inset-0 linear-to-t from-slate-950 via-transparent to-transparent opacity-60"
          ></div>

          <div
            class="absolute top-3 right-3 bg-slate-950/80 backdrop-blur-md px-2.5 py-1 rounded-lg border border-white/10 flex items-center gap-1.5"
          >
            <span class="text-yellow-400 text-xs">★</span>
            <span class="text-white text-xs font-black">{{
              movie.vote_average | number: '1.1-1'
            }}</span>
          </div>
        </div>

        <div class="p-5">
          <h3
            class="text-slate-100 font-bold truncate text-sm mb-2 group-hover:text-blue-400 transition-colors"
          >
            {{ movie.title }}
          </h3>

          <div class="flex justify-between items-center mt-4">
            <span
              class="text-slate-500 text-[10px] font-bold uppercase tracking-widest bg-slate-800 px-2 py-1 rounded"
            >
              {{ movie.release_date | date: 'yyyy' }}
            </span>
            <button
              class="text-blue-500 text-xs font-black uppercase tracking-wider hover:text-blue-400 transition-colors cursor-pointer"
            >
              Details →
            </button>
          </div>
        </div>
      </div>
    }
  </div>
</div>

<div class="max-w-xl mx-auto px-6 py-16">
  <div class="mb-10 text-center md:text-left">
    <h1 class="text-3xl font-bold text-slate-100 tracking-tight">Get in touch</h1>
    <p class="text-slate-400 mt-2 font-medium">Send me a message below.</p>
  </div>

  <form class="space-y-6">
    <div class="flex flex-col md:flex-row gap-4">
      <div class="flex-1">
        <input
          type="text"
          placeholder="Name"
          class="w-full bg-slate-900/50 border border-slate-800 rounded-lg px-4 py-3 text-slate-200 placeholder:text-slate-500 focus:outline-hidden focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all duration-300"
        />
      </div>

      <div class="flex-1">
        <input
          type="email"
          placeholder="Email"
          class="w-full bg-slate-900/50 border border-slate-800 rounded-lg px-4 py-3 text-slate-200 placeholder:text-slate-500 focus:outline-hidden focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all duration-300"
        />
      </div>
    </div>

    <div>
      <textarea
        rows="5"
        placeholder="Your message"
        class="w-full bg-slate-900/50 border border-slate-800 rounded-lg px-4 py-3 text-slate-200 placeholder:text-slate-500 focus:outline-hidden focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all duration-300 resize-none"
      ></textarea>
    </div>

    <div class="text-right">
      <button
        type="submit"
        class="w-full md:w-auto bg-blue-600 hover:bg-blue-500 text-white font-bold px-10 py-3 rounded-lg transition-all duration-300 shadow-lg shadow-blue-500/10 active:scale-95"
      >
        Send Message
      </button>
    </div>
  </form>
</div>

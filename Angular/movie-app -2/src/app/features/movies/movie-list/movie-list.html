<div class="container mx-auto max-w-7xl px-4 py-16">
  <div class="mb-12 border-l-4 border-blue-500 pl-6">
    <h1 class="text-4xl font-black text-white tracking-tighter uppercase">Trending Now</h1>
    <p class="text-slate-400 mt-2 font-medium">Discover the most watched movies this week.</p>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8">
    @for (movieItem of movies; track movieItem.id) {
      <app-movie-card [movie]="movieItem"></app-movie-card>
    }
  </div>
</div>

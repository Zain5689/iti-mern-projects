<section class="py-20 bg-transparent relative overflow-hidden">
  <div class="absolute top-0 left-1/4 w-64 h-64 bg-amber-500/10 blur-[100px] -z-10"></div>
  <div class="absolute bottom-0 right-1/4 w-64 h-64 bg-primary/10 blur-[100px] -z-10"></div>

  <div class="container mx-auto px-6">
    <div class="text-center mb-16">
      <span class="text-amber-500 font-semibold tracking-widest uppercase text-sm">Community</span>
      <h2 class="text-4xl font-extrabold mt-2 text-slate-900 dark:text-white">
        What Our
        <span class="text-transparent bg-clip-text bg-linear-to-r from-amber-500 to-orange-600"
          >Viewers</span
        >
        Say
      </h2>
      <div class="h-1 w-20 bg-amber-500 mx-auto mt-4 rounded-full"></div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-10">
      @for (item of reviews; track item.name) {
        <div
          class="group relative bg-white/70 dark:bg-slate-800/50 backdrop-blur-md p-8 rounded-3xl border border-white/20 dark:border-slate-700/50 shadow-xl hover:shadow-amber-500/10 transition-all duration-500 hover:-translate-y-2"
        >
          <div
            class="absolute top-6 right-8 text-6xl text-slate-200 dark:text-slate-700/30 font-serif leading-none group-hover:text-amber-500/20 transition-colors"
          >
            “
          </div>

          <div class="flex gap-1 mb-6">
            @for (star of [1, 2, 3, 4, 5]; track star) {
              <svg class="w-5 h-5 text-amber-500 fill-current" viewBox="0 0 20 20">
                <path
                  d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"
                />
              </svg>
            }
          </div>

          <p
            class="relative z-10 text-slate-600 dark:text-slate-300 leading-relaxed italic mb-8 min-h-20"
          >
            "{{ item.comment }}"
          </p>

          <div class="flex items-center gap-4">
            <div class="relative">
              <div
                class="w-12 h-12 rounded-2xl bg-linear-to-tr from-amber-500 to-orange-600 flex items-center justify-center font-bold text-white text-lg shadow-lg group-hover:rotate-6 transition-transform"
              >
                {{ item.name[0] }}
              </div>
              <div
                class="absolute -bottom-1 -right-1 w-4 h-4 bg-green-500 border-2 border-white dark:border-slate-800 rounded-full"
              ></div>
            </div>
            <div>
              <h4
                class="text-base font-bold text-slate-900 dark:text-white group-hover:text-amber-500 transition-colors"
              >
                {{ item.name }}
              </h4>
              <p
                class="text-xs font-medium text-slate-500 dark:text-slate-400 uppercase tracking-wider"
              >
                {{ item.role }}
              </p>
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</section>

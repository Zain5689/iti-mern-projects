<section class="max-w-7xl mx-auto py-24 bg-transparent relative overflow-hidden">
  <div
    class="absolute top-0 left-1/4 w-72 h-72 bg-blue-600/10 blur-[120px] -z-10 animate-pulse"
  ></div>
  <div class="absolute bottom-0 right-1/4 w-72 h-72 bg-indigo-600/10 blur-[120px] -z-10"></div>

  <div class="container mx-auto px-6">
    <div class="text-center mb-20">
      <span class="text-blue-500 font-black tracking-[0.2em] uppercase text-xs">Testimonials</span>
      <h2 class="text-xl md:text-3xl font-black mt-3 text-slate-900 dark:text-white tracking-tight">
        What Our
        <span class="text-transparent bg-clip-text bg-linear-to-r from-blue-500 to-indigo-400">
          Cinephiles
        </span>
        Say
      </h2>
      <div
        class="h-1.5 w-12 bg-blue-600 mx-auto mt-6 rounded-full shadow-lg shadow-blue-500/50"
      ></div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
      @for (item of reviews(); track item.name) {
        <div
          class="group relative bg-white/40 dark:bg-slate-900/40 backdrop-blur-xl p-8 rounded-[2.5rem] border border-white/20 dark:border-white/5 shadow-2xl transition-all duration-500 hover:-translate-y-3 hover:bg-white/60 dark:hover:bg-slate-800/60"
        >
          <div
            class="absolute top-8 right-10 text-7xl text-blue-500/10 font-serif leading-none group-hover:text-blue-500/20 transition-all duration-500"
          >
            “
          </div>

          <div class="flex gap-1.5 mb-8">
            @for (star of [1, 2, 3, 4, 5]; track star) {
              <svg
                class="w-4 h-4 text-blue-500 fill-current drop-shadow-[0_0_8px_rgba(59,130,246,0.5)]"
                viewBox="0 0 20 20"
              >
                <path
                  d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"
                />
              </svg>
            }
          </div>

          <p
            class="relative z-10 text-slate-600 dark:text-slate-300 leading-relaxed italic mb-10 min-h-80px text-lg"
          >
            "{{ item.comment }}"
          </p>

          <div class="flex items-center gap-5">
            <div class="relative">
              <div
                class="w-14 h-14 rounded-2xl bg-linear-to-br from-blue-600 to-indigo-700 flex items-center justify-center font-black text-white text-xl shadow-xl shadow-blue-500/20 group-hover:rotate-12 transition-transform duration-500"
              >
                {{ item.name[0] }}
              </div>
              <div
                class="absolute -bottom-1 -right-1 w-4 h-4 bg-emerald-500 border-4 border-white dark:border-slate-900 rounded-full"
              ></div>
            </div>

            <div>
              <h4
                class="text-lg font-black text-slate-900 dark:text-white group-hover:text-blue-500 transition-colors duration-300"
              >
                {{ item.name }}
              </h4>
              <p
                class="text-[10px] font-bold text-blue-500/70 dark:text-blue-400/60 uppercase tracking-[0.15em]"
              >
                {{ item.role }}
              </p>
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</section>

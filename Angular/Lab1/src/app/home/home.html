<div class="min-h-screen flex flex-col bg-slate-950 font-sans">
  <app-navbar></app-navbar>

  <main class="grow flex items-center justify-center p-6">
    <div
      class="max-w-sm w-full bg-slate-900/50 backdrop-blur-xl border border-white/10 rounded-[2.5rem] overflow-hidden shadow-2xl hover:border-blue-500/50 transition-all duration-500 group"
    >
      <div class="relative h-32 linear-to-br from-blue-600 via-indigo-600 to-purple-700">
        <div class="absolute top-2 right-2 w-16 h-16 bg-white/10 rounded-full blur-xl"></div>

        <div class="absolute -bottom-12 left-8">
          <img
            [src]="user.image"
            [alt]="user.name"
            class="w-24 h-24 rounded-3xl border-4 border-slate-900 object-cover shadow-2xl group-hover:scale-105 transition-transform duration-300"
          />
        </div>
      </div>

      <div class="pt-16 pb-8 px-8">
        <div class="flex justify-between items-start mb-6">
          <div>
            <h3
              class="text-2xl font-bold text-white tracking-tight group-hover:text-blue-400 transition-colors"
            >
              {{ user.name }}
            </h3>
            <p class="text-slate-400 text-sm font-medium">{{ user.email }}</p>
          </div>

          <span
            [class]="
              user.isAdmin
                ? 'bg-blue-500/20 text-blue-400 border-blue-500/30'
                : 'bg-slate-800/50 text-slate-500 border-slate-700'
            "
            class="text-[10px] uppercase tracking-[0.2em] px-3 py-1.5 rounded-full border font-black"
          >
            {{ user.isAdmin ? 'Admin' : 'User' }}
          </span>
        </div>

        <div class="flex gap-4 mb-8 py-4 border-y border-white/5">
          <div class="text-center">
            <p class="text-xs text-slate-500 uppercase tracking-widest">Age</p>
            <p class="text-white font-bold">{{ user.age }}</p>
          </div>
          <div class="w-px bg-white/5"></div>
          <div class="text-center">
            <p class="text-xs text-slate-500 uppercase tracking-widest">ID</p>
            <p class="text-white font-bold">{{ user.id }}</p>
          </div>
        </div>

        <button
          (click)="showAlert(user.isAdmin)"
          class="w-full bg-blue-600 hover:bg-blue-500 text-white py-4 rounded-2xl text-sm font-bold transition-all shadow-lg shadow-blue-600/20 active:scale-[0.98] flex items-center justify-center gap-2"
        >
          <span>Identify Role</span>
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-4 w-4"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M9 5l7 7-7 7"
            />
          </svg>
        </button>
      </div>
    </div>
  </main>

  <app-footer></app-footer>
</div>
